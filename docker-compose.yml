# The everyday settings from .env, for the api and the worker alike: both
# read them (lms/services/settings.py), and a value set on the desktop's
# Settings screen wins over them.
x-lms-settings: &lms-settings
  LMS_TIMEZONE: ${LMS_TIMEZONE:-Australia/Melbourne}
  LMS_PUBLIC_URL: ${LMS_PUBLIC_URL:-}
  LMS_DAILY_HOUR: ${LMS_DAILY_HOUR:-6}
  LMS_QUIZ_COOLDOWN_MINUTES: ${LMS_QUIZ_COOLDOWN_MINUTES:-60}
  LMS_SMTP_HOST: ${LMS_SMTP_HOST:-}
  LMS_SMTP_PORT: ${LMS_SMTP_PORT:-587}
  LMS_SMTP_USER: ${LMS_SMTP_USER:-}
  LMS_SMTP_PASSWORD: ${LMS_SMTP_PASSWORD:-}
  LMS_SMTP_FROM: ${LMS_SMTP_FROM:-}
  LMS_SMTP_SECURITY: ${LMS_SMTP_SECURITY:-starttls}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms}
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 5435 so it sits beside Simple WMS's (5433) and Simple TMS's (5434) on one machine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    # migrations run on every start, before the API takes requests
    command: sh -c "alembic upgrade head && uvicorn lms.api.app:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *lms-settings
      LMS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lms}
    volumes:
      # tickets' photos and policy signatures (LMS_UPLOAD_DIR)
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # Caddy is the only door in a real install. Published on the host as well
    # for local work and CI.
    ports:
      - "127.0.0.1:${LMS_API_PORT:-8033}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Sends the emails in the outbox with backoff, and runs the daily job
  # (reminders, and the managers' Monday digest). Waits for the api's
  # migrations. Later steps give it the webhooks and print jobs.
  worker:
    build: ./api
    restart: unless-stopped
    command: python -m lms.worker
    environment:
      <<: *lms-settings
      LMS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lms}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      LMS_DOMAIN: ${LMS_DOMAIN:-localhost}
      LMS_HTTP_PORT: ${LMS_HTTP_PORT:-80}
      LMS_HTTPS_PORT: ${LMS_HTTPS_PORT:-443}
    # The same port inside and out: Caddy names it in its redirect to https.
    ports:
      - "${LMS_HTTP_PORT:-80}:${LMS_HTTP_PORT:-80}"
      - "${LMS_HTTPS_PORT:-443}:${LMS_HTTPS_PORT:-443}"
    volumes:
      # the folder, not the file: an edited Caddyfile is a new file, and a
      # file mount would keep showing Caddy the old one
      - ./deploy:/etc/caddy:ro
      # the desktop, built on the host: cd apps/desktop && npm run build
      - ./apps/desktop/dist:/srv/desktop:ro
      # the learner app, built on the host: cd apps/learner && npm run build
      - ./apps/learner/dist:/srv/learner:ro
      - caddy_data:/data
      - caddy_config:/config
    # the API runs its migrations first: wait until it answers
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
