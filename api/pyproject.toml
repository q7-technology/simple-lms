[project]
name = "simple-lms-api"
version = "0.1.0"
description = "Simple LMS API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  # Range requests in FileResponse, so a phone can seek a module's video
  "starlette>=0.40",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  # the time zone's rules, so "today" is right in a slim image too
  "tzdata>=2024.1",
  # the worker posts events to webhooks and print jobs to Platen
  "httpx>=0.27",
  # checks Microsoft's ID tokens (RS256, by the tenant's published keys).
  # Pinned: it decides who is signed in, so a new version is a choice.
  "pyjwt[crypto]==2.15.1",
]

[project.optional-dependencies]
# httpx2: what newer Starlette test clients want, as in Simple WMS and Simple TMS
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx2>=0.1"]

[project.scripts]
lms = "lms.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
filterwarnings = [
  "error",
  # third-party: Starlette's test client still uses an old anyio alias
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
